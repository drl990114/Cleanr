id = "builtin-system-global-locations"
version = "0.14.0"

[[locations]]
id = "windows-chrome-cache-root"
label = "Chrome cache"
kind = "browser-caches"
platforms = ["windows"]
base = "data-local"
relative_path = "Google/Chrome/User Data"
expansion = { child_globs = ["Default", "Profile *", "Guest Profile"], suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "ShaderCache"], max_matches = 96 }

