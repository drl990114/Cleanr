# macOS targets were audited against the allowlists in the MIT-licensed
# https://github.com/yagcioglutoprak/dusty source at commit
# acaa3f6a5e9b535892ce2301b0a57772a0ee430a and the MIT-licensed
# https://github.com/momenbasel/PureMac source at commit
# 376b2380b0bffe7d614258731a58732ed65d563b. Confidence, selection, and risk
# semantics below are Cleanr-specific. Trash, Mail, iOS backups, Time Machine
# snapshots, browser service workers, and system-owned roots remain excluded.
#
# Windows targets were independently narrowed from the GPL-3.0 BleachBit source
# at commit ab0e4b94e29b8233adbe7ab010656e61b162c63d and the CC-BY-SA-4.0
# Winapp2 database at commit 3c0156de665cc180edc76745e425412ccc4356ca. Cleanr
# does not import either rule database. Only stale regular files from the
# current user's Temp and D3DSCache directories are included. Explorer
# thumbnails, system-owned crash dumps, Windows Update and Delivery Optimization data,
# Prefetch, the Recycle Bin, the registry, and system-owned roots are excluded.

[[rules]]
id = "chrome-cache-directory"
label = "Chrome cache directory"
category = "browser-cache"
match = { kind = "directory", path_glob = "**/Google/Chrome/**/{Cache,Code Cache,GPUCache,DawnCache,ShaderCache}", min_size = 1048576 }
confidence = "high"
default_selected = true
action = "trash"
reason = "Chrome cache directories contain downloaded web resources that Chrome recreates automatically."
risk_note = "This does not target browser profiles, history, cookies, or saved sessions; the next browser launch may need to redownload cached content."

