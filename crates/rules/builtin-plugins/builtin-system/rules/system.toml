[[rules]]
id = "windows-stale-directx-shader-cache-file"
label = "Stale Windows DirectX shader cache file"
category = "application-cache"
match = { kind = "file", path_glob = "**/AppData/Local/D3DSCache/**", max_age_days = 30 }
confidence = "high"
default_selected = true
platforms = ["windows"]
source_refs = ["bleachbit", "winapp2"]
action = "trash"
reason = "This is a generated graphics shader cache file in the current user's Windows D3DSCache directory and it has not been modified for at least 30 days."
risk_note = "Windows regenerates this cache as needed, so a later graphics application launch may spend time recompiling shaders; Cleanr does not stop applications, and a file Windows keeps locked remains in place as a failed item."

[[rules]]
id = "windows-stale-user-temporary-file"
label = "Stale Windows user temporary file"
category = "temporary-files"
match = { kind = "file", path_glob = "**/AppData/Local/Temp/**", max_age_days = 30 }
confidence = "high"
default_selected = true
platforms = ["windows"]
source_refs = ["bleachbit", "winapp2"]
action = "trash"
reason = "This is a regular file in the current user's Windows temporary directory and it has not been modified for at least 30 days."
risk_note = "The Temp directory and its subdirectories are never selected; Cleanr does not stop applications, and a file Windows keeps locked remains in place as a failed item."

