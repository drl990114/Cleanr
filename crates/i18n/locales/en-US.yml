rules.builtin-dev.conda-package-cache-container.label: "Conda retained package cache"
rules.builtin-dev.conda-package-cache-container.reason: "Conda package caches include extracted packages that may be linked by installed environments."
rules.builtin-dev.conda-package-cache-container.risk_note: "Read-only container: only compressed downloads with cache evidence may be reviewed."
