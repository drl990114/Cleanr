# Presentation text for the cache-expansion rules; report evidence stays canonical.
rules.builtin-dev.macos-playwright-cache.label: "Playwright download cache"
rules.builtin-dev.macos-playwright-cache.reason: "Playwright stores downloaded runtime binaries in this standard user cache."
rules.builtin-dev.macos-playwright-cache.risk_note: "Review the retained versions and quit dependent tools first; binaries may be shared by projects and require a large download before offline work can resume."
