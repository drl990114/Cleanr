rules.builtin-dev.puppeteer-browser-cache.label: "Puppeteer browser downloads"
rules.builtin-dev.puppeteer-browser-cache.reason: "Puppeteer downloads managed browser versions into its default user cache."
rules.builtin-dev.puppeteer-browser-cache.risk_note: "Quit browser automation and review retained versions; projects may need to download browsers again before they can run."
rules.builtin-dev.linux-go-build-cache.label: "Go build cache"
rules.builtin-dev.linux-go-build-cache.reason: "Go stores generated compiler and test results in this user cache."
rules.builtin-dev.linux-go-build-cache.risk_note: "Stop Go builds and tests first; the next invocation must rebuild missing cache entries."
rules.builtin-dev.windows-go-build-cache.label: "Go build cache"
rules.builtin-dev.windows-go-build-cache.reason: "Go stores generated compiler and test results in this user cache."
rules.builtin-dev.windows-go-build-cache.risk_note: "Stop Go builds and tests first; the next invocation must rebuild missing cache entries."
rules.builtin-dev.windows-pip-download-cache.label: "pip download cache"
rules.builtin-dev.windows-pip-download-cache.reason: "pip stores downloaded HTTP responses and locally built wheels in this cache."
rules.builtin-dev.windows-pip-download-cache.risk_note: "Stop pip and Python package installation first; future installs may require network access and wheel compilation."
rules.builtin-dev.linux-sccache.label: "sccache compiler cache"
rules.builtin-dev.linux-sccache.reason: "sccache retains generated compiler outputs in its local disk cache."
rules.builtin-dev.linux-sccache.risk_note: "Stop the sccache server and builds before review; later compilation may be slower."
rules.builtin-dev.macos-sccache.label: "sccache compiler cache"
rules.builtin-dev.macos-sccache.reason: "sccache retains generated compiler outputs in its local disk cache."
rules.builtin-dev.macos-sccache.risk_note: "Stop the sccache server and builds before review; later compilation may be slower."
rules.builtin-dev.windows-sccache.label: "sccache compiler cache"
rules.builtin-dev.windows-sccache.reason: "sccache retains generated compiler outputs in its local disk cache."
rules.builtin-dev.windows-sccache.risk_note: "Stop the sccache server and builds before review; later compilation may be slower."
rules.builtin-dev.uv-managed-cache.label: "uv cache (tool managed)"
rules.builtin-dev.uv-managed-cache.reason: "uv requires its own cache-management operations and locking; direct filesystem removal is unsafe."
rules.builtin-dev.uv-managed-cache.risk_note: "Read-only: use uv cache management after reviewing its separate deletion and recovery behavior. Cleanr does not run it."
rules.builtin-dev.macos-uv-managed-cache.label: "uv cache (tool managed)"
rules.builtin-dev.macos-uv-managed-cache.reason: "uv requires its own cache-management operations and locking; direct filesystem removal is unsafe."
rules.builtin-dev.macos-uv-managed-cache.risk_note: "Read-only: use uv cache management after reviewing its separate deletion and recovery behavior. Cleanr does not run it."
rules.builtin-dev.windows-uv-managed-cache.label: "uv cache (tool managed)"
rules.builtin-dev.windows-uv-managed-cache.reason: "uv requires its own cache-management operations and locking; direct filesystem removal is unsafe."
rules.builtin-dev.windows-uv-managed-cache.risk_note: "Read-only: use uv cache management after reviewing its separate deletion and recovery behavior. Cleanr does not run it."
rules.builtin-dev.linux-torchinductor-cache.label: "TorchInductor compiled kernels"
rules.builtin-dev.linux-torchinductor-cache.reason: "TorchInductor stores generated kernels and graph compilation results in a per-user temporary directory."
rules.builtin-dev.linux-torchinductor-cache.risk_note: "Only current-user-owned data is eligible. Stop Python, training and inference tasks; cleaning can trigger expensive recompilation and GPU autotuning."
rules.builtin-dev.linux-torchinductor-triton-cache.label: "TorchInductor Triton kernels"
rules.builtin-dev.linux-torchinductor-triton-cache.reason: "Triton kernels are nested inside the default TorchInductor cache."
rules.builtin-dev.linux-torchinductor-triton-cache.risk_note: "Stop Python, training and inference tasks; kernels must be compiled and tuned again. Overlapping parent and child selections are counted once."
rules.builtin-dev.macos-jetbrains-container.label: "JetBrains retained data"
rules.builtin-dev.macos-jetbrains-container.reason: "JetBrains system directories mix generated caches with Local History and other retained data."
rules.builtin-dev.macos-jetbrains-container.risk_note: "Read-only container: only explicitly identified index and log leaves may be reviewed."
rules.builtin-dev.macos-jetbrains-unreviewed-products.label: "Unreviewed JetBrains product data"
rules.builtin-dev.macos-jetbrains-unreviewed-products.reason: "This product layout has not been approved for cache-only cleanup."
rules.builtin-dev.macos-jetbrains-unreviewed-products.risk_note: "Read-only: preserve this product directory and all descendants."
rules.builtin-dev.macos-jetbrains-product-container.label: "JetBrains version data"
rules.builtin-dev.macos-jetbrains-product-container.reason: "This version directory includes Local History and other state that must be retained."
