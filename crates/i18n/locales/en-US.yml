rules.builtin-dev.huggingface-container.risk_note: "Read-only container: only the separate Xet download chunk cache is eligible for review."
rules.builtin-dev.huggingface-retained-data.label: "Hugging Face models and retained data"
rules.builtin-dev.huggingface-retained-data.reason: "Models, datasets, tokens and unknown cache contents are retained."
